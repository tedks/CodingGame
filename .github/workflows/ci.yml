name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: devenv
          skipPush: true

      - name: Generate .bazelrc.user
        run: |
          nix develop --command bash -c './scripts/gen-bazelrc-user.sh'

      - name: Build
        run: |
          nix develop --command bazel build //...

      - name: Test
        run: |
          # Install xvfb for headless X11 tests
          sudo apt-get update && sudo apt-get install -y xvfb
          nix develop --command bash -c 'xvfb-run -a -s "-screen 0 1024x768x24 -ac" bazel test //...'

      - name: Format check
        run: |
          nix develop --command bash -c '
            go fmt ./...
            if [ -n "$(git status --porcelain)" ]; then
              echo "Code is not formatted. Run: go fmt ./..."
              git diff
              exit 1
            fi
          '
