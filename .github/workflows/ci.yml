name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: devenv
          skipPush: true

      - name: Generate .bazelrc.user
        run: |
          nix develop --command bash -c './scripts/gen-bazelrc-user.sh'

      - name: Build
        run: |
          nix develop --command bazel build //...

      - name: Install xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        env:
          CODINGGAME_SCREENSHOT_DIR: /tmp/codinggame-screenshots
          CODINGGAME_SAVE_SCREENSHOTS: "1"
        run: |
          # Screenshot directory is created by test code via NewCapturer/ScreenshotDir
          nix develop --command bash -c 'xvfb-run -a -s "-screen 0 1024x768x24 -ac" bazel test //...'

      - name: Race detection tests
        run: |
          # Run tests with Go race detector enabled
          # This catches data races that may not manifest in normal test runs
          nix develop --command bash -c 'xvfb-run -a -s "-screen 0 1024x768x24 -ac" bazel test //... --@io_bazel_rules_go//go/config:race'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: /tmp/codinggame-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Format check
        run: |
          nix develop --command bash -c '
            go fmt ./...
            if [ -n "$(git status --porcelain)" ]; then
              echo "Code is not formatted. Run: go fmt ./..."
              git diff
              exit 1
            fi
          '
